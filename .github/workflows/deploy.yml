name: Despliegue Automatico a cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Actualizar y Desplegar en cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar repositorio en cPanel (Git Pull)
        run: |
          response=$(curl -s -k -H "Authorization: cpanel stamericacom:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://node-lake956.grupoabhost.net:2083/execute/VersionControl/update?repository_root=/home/stamericacom/repositories/stamerica_Web")
          echo "RESPUESTA UPDATE: $response"

      - name: Desplegar cambios a public_html (.cpanel.yml)
        run: |
          response=$(curl -s -k -H "Authorization: cpanel stamericacom:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://node-lake956.grupoabhost.net:2083/execute/VersionControlDeployment/create?repository_root=/home/stamericacom/repositories/stamerica_Web")
          echo "RESPUESTA DEPLOY: $response"